const people=[
 {"id":"jingzhe","name":"驚蟄","group":"主要角色","identity":"小說家・操蟲使","image":"jingzhe_daily_calm_3q_thigh_no_kiseru.png","facts":[["年齡","約三十歲"],["身分","小說家・操蟲使"]],"paragraphs":["寡言而內斂的小說家。習慣將想法留在心裡，以書寫整理自己，也很少主動向人求助。","童年因操蟲使的身分受到同儕疏遠，家中卻一直和睦。直到十六歲那年，母親因拒絕協助劉家而遭用計逼死，這份安穩才告終。","他曾無法體諒父親的無作為，除了小說事務，幾乎不再與父親互動。後來才慢慢理解，父親終究是普通人，能做的有限；也慶幸父親經商的身分，讓他們能在劉家迫害時逃離紅原州，不致流離失所。"],"relation":"髮切是他童年照顧過的螳螂；大百足則在他約二十歲時與他相遇。影之魔女因喜歡他的小說，成了能直接取得新稿的讀者。","notes":[["最喜歡的昆蟲","最喜歡的其實是豆娘。他覺得深色的豆娘很優雅，與平靜水面相襯的模樣也十分好看；牠們能自由飛行，更令他羨慕。"],["母親留下的浴衣","那件長年穿在身上的墨綠浴衣，出自母親之手。他因為這份來歷而一直穿著，也一直保存著母親留下的痕跡。"],["父親買來的菸斗","隨身使用的細長菸斗，是父親買給他的。與母親留下的浴衣一樣，都是他保存、使用至今的舊物。"],["難等的新刊","父親會替他安排小說出版，但父子之間的疏遠，讓新書出版的間隔既長又不固定。喜歡小說的影之魔女因此直接找上作者本人，送給他一只方便取得最新稿件的魔法郵箱。"]],"draftLabel":"本輪補充文案・呈現待確認"},
 {id:'hanami',name:'花見',group:'主要角色',identity:'月下庄的女將',image:'hanami_bright_3q_full_unarmed.png',facts:[['生活舞台','月下庄'],['擅長','照料旅客・使用薙刀']],paragraphs:['爽朗、主動，擅長照顧人，也有直接表達情感的勇氣。她的親切與行動力，讓原本保持距離的驚蟄逐漸走進與人相處的日常。','她的勇氣並非不知道害怕，而是明白自己可能會輸，仍願意在真正有事時往前站。暮春的保護與教導，曾深深影響她。'],relation:'與夢見一同生活在月下庄；保管著暮春留下的薙刀。',notes:[['不常使用的薙刀','她平常仔細照料暮春留下的薙刀，避免生鏽。那句只會「一點」的回答，並不等於她對握起武器毫無把握。']]},
 {id:'yumemi',name:'夢見',group:'主要角色',identity:'月下庄的溫柔身影',image:'yumemi_gentle_3q_full_unarmed.png',facts:[['生活舞台','月下庄'],['個性','溫柔・內斂・細膩']],paragraphs:['溫柔而靦腆，不習慣強烈表達自己，卻會留意細微的變化，以陪伴慢慢拉近與人的距離。','她的柔弱並不代表沒有想法。相較於花見的直接，她與驚蟄之間的情感，更多累積在細節與日常相處之中。'],relation:'與花見關係親近；也是驚蟄在月下庄逐漸建立連結的重要人物。',notes:[]},
 {"id":"jorogumo","name":"絡新婦","group":"次要角色","identity":"月下庄事件中的怪異","image":"jorogumo_watchful_front_full_no_prop.png","facts":[["本質","蜘蛛妖怪・捕食者"],["人形的用途","接近並誘捕人類"]],"paragraphs":["外型看似身穿白無垢的女性，實際上是把人類視為獵物的蜘蛛妖怪。她會模仿微笑、關心與道歉，卻不真正理解其中的情感差異。","對她而言，人形與言語都是達成目的的工具。她以模仿接近、欺騙人類，再進行捕食與控制。"],"relation":"與土蜘蛛同行，能藉肉眼幾乎看不見的小蜘蛛，在一定程度上控制被附著的生物。","notes":[["披上人類的外貌","妖怪並不一定覺得有必要化為人形。絡新婦選擇這樣做，是為了設下陷阱，接近並誘捕人類。她的溫柔表情，也只是狩獵時套用的反應。"]],"draftLabel":"本輪補充文案・呈現待確認"},

 {"id":"kamikiri","name":"髮切","group":"次要角色","identity":"驚蟄應召作戰的蟲妖","image":"kamikiri_ready_3q_full_right_sword_left_forearm_blade.png","facts":[["種族","螳螂妖怪"],["性別","雌性"]],"paragraphs":["驚蟄身邊的螳螂妖怪，身形瘦小而輕盈，以迅速切入與斬擊作戰。右手持獨立忍者刀，左臂則使用直刃袖劍。","驚蟄童年時，在住家附近山中發現了失去右前足的她。受到驚蟄照顧後，她化為妖怪，並開始服侍驚蟄。"],"relation":"與驚蟄的關係，從山中一隻受照顧的螳螂開始。","notes":[["右手的刀","還是螳螂時，她便失去了右前足。這段經歷也成了如今不對稱武裝的來歷：右手另外持刀，沒有自帶刀刃。"],["選擇人形","妖怪能以自身妖力化為人形，是否如此取決於自己的意願。髮切屬於因親近人類而選擇人形的妖怪。"]],"draftLabel":"本輪補充文案・呈現待確認"},
 {"id":"omukade","name":"大百足","group":"次要角色","identity":"驚蟄應召作戰的蟲妖","image":"omukade_ready_coiled_raised_full_no_prop.png","facts":[["種族","百足妖怪"],["性別","雌性"]],"paragraphs":["驚蟄身邊的百足妖怪。以厚重甲殼與整個身軀撞擊、壓制敵人，和髮切的輕巧迅速形成不同的戰鬥風格。","驚蟄約二十歲時意外遇到她。當時，她因為體型比一般百足妖怪小，而受到同族排擠。"],"relation":"與驚蟄相遇時，她已是遭同族排擠的百足妖怪。","notes":[["大百足其實偏小","她的身體總長約二至三公尺，比土蜘蛛小。一般百足妖怪的大小卻不輸土蜘蛛，因此眼前這隻看起來已頗有分量的大百足，對同族而言仍是個偏小的個體。"]],"draftLabel":"本輪補充文案・呈現待確認"},
 {id:'achirichi',name:'亞奇里奇',group:'次要角色',identity:'帶來黑卡的訪客',image:'achirichi_first_meeting_calm_3q_full_no_prop.png'},
 {"id":"shadow-witch","name":"影之魔女","group":"次要角色","identity":"驚蟄的讀者","image":"shadow_witch_cold_3q_full_holding_staff.png","facts":[["與驚蟄的關係","小說的忠實讀者"],["贈予之物","魔法郵箱"]],"paragraphs":["居於影之境界的魔女，也是驚蟄的讀者。她偶然讀到了驚蟄父親協助出版的小說，便非常喜歡。","然而，父子關係讓小說的出版間隔既長又不固定。她於是直接找上驚蟄，贈予一只魔法郵箱，方便取得最新的小說進度。"],"relation":"她與驚蟄的連結，始於一本偶然讀到的小說。","notes":[["從讀者找到作者","等待新書出版太不方便，魔女便直接找上作者本人。那只古雅的黑色郵箱，正是她為了取得最新稿件而送出的禮物。"]],"draftLabel":"本輪補充文案・呈現待確認"},
 {id:'muchun',name:'暮春',group:'被提及的人物',identity:'花見口中的暮春大姊',image:null,facts:[['與花見的關係','曾保護並教導她'],['留下的物件','花見保管的薙刀']],paragraphs:['暮春曾保護並教導花見，讓她逐漸明白，自己不能永遠躲在姊姊身後。','她留下的薙刀由花見保管。平常雖不常使用，花見仍仔細照料，直到必須取出它的時刻。'],relation:'這一頁示範無立繪人物的寬版文字配置。人物完整背景與逸聞將於第四階段整理。',notes:[]},
 {"id":"mother","name":"驚蟄的母親","group":"被提及的人物","identity":"操蟲使・驚蟄的母親","image":null,"facts":[["身分","操蟲使"],["享年","四十二歲"]],"paragraphs":["驚蟄的母親，曾親手替兒子製作那件墨綠色浴衣。在她生前，家中原本和睦，即使驚蟄因操蟲使身分遭同儕疏遠，仍有一個安穩的家。","劉家在自治計畫受阻時招募人手，她因能力而被盯上。由於不願協助劉家，最終遭用計逼死；那年她四十二歲，驚蟄十六歲。"],"relation":"二十六歲時生下驚蟄。她的離世，也成了驚蟄與父親逐漸疏遠的轉折。","notes":[["十六歲時收服的蟲妖","她十六歲時，鎮壓並收服了曾在紅原州作亂、造成飢荒的強大蝗蟲妖怪「稻子」。雙方在互相理解後建立合作，稻子也同意不再作亂；牠也是因親近人類而選擇化為人形的妖怪。"],["浴衣裡的一次約定","浴衣內縫有她使用的特殊香。她死後，稻子的原有契約解除，恢復自由並歸隱；但牠另行同意，燃燒整件浴衣，可以向牠發出最後一次召喚。這只有一次機會，是否出手仍由稻子自己決定。"]],"draftLabel":"本輪補充文案・呈現待確認"},
 {"id":"father","name":"驚蟄的父親","group":"被提及的人物","identity":"商人・替驚蟄出版小說的人","image":null,"facts":[["身分","商人"],["能力背景","普通人"]],"paragraphs":["驚蟄的父親，是一名普通的商人。妻子生前，家中原本和睦；她去世後，驚蟄卻一時無法體諒他的無作為，逐漸與他疏遠。","父子之間除了小說事務，幾乎沒有互動。後來，驚蟄才慢慢理解父親身為普通人的能力限制，也慶幸父親經商的身分，讓他們在劉家迫害時得以逃離紅原州，不致流離失所。"],"relation":"他替驚蟄安排小說出版，也是那支細長菸斗的贈予者。","notes":[["仍有往來的稿件","小說是父子疏遠期間少數仍維持的聯繫。他會替驚蟄安排出版，只是父子關係使出版間隔既長又不固定。"],["長年使用的菸斗","驚蟄隨身的細長東方菸管，是父親買給他的，之後一直作為長年使用的舊物留在身邊。"]],"draftLabel":"本輪補充文案・呈現待確認"}
];
const byId=id=>document.getElementById(id);
let index=0,tab='intro',artIndex=0;
let artReturnFocus=null;
const roster=byId('roster');
let lastGroup='';
people.forEach((person,i)=>{
 if(person.group!==lastGroup){const h=document.createElement('h2');h.className='group-title';h.textContent=person.group;roster.append(h);lastGroup=person.group;}
 const b=document.createElement('button');b.type='button';b.className='person'+(person.name.length>5?' long-name':'');b.textContent=person.name;b.dataset.index=i;b.addEventListener('click',()=>selectPerson(i));roster.append(b);
});
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function currentGallery(){const id=people[index].id;return [...(portraitGallery[id]||[]),...(bonusPortraitGallery[id]||[])];}
function renderHeadVariants(item){
 for(const id of ['portrait-variants','art-view-variants']){
  const container=byId(id);container.replaceChildren();
  for(const variant of item.variants||[]){
   const figure=el('figure','variant-figure'),cutout=el('div','variant-cutout'),image=el('img');
   image.src=variant.src;image.alt=people[index].name+'・'+variant.label;
   if(variant.crop){const [x,y,w,h]=variant.crop;cutout.classList.add('is-cropped');cutout.style.aspectRatio=w+'/'+h;cutout.style.setProperty('--image-width',100*variant.sourceSize[0]/w+'%');cutout.style.setProperty('--image-left',-100*x/w+'%');cutout.style.setProperty('--image-top',-100*y/h+'%');}
   cutout.append(image);figure.append(cutout);container.append(figure);
  }
 }
}
function renderPortrait(){
 const gallery=currentGallery();if(!gallery.length)return;
 artIndex=(artIndex+gallery.length)%gallery.length;const item=gallery[artIndex];
 byId('portrait').src=item.src;byId('portrait').alt=people[index].name+'・'+item.label;
 byId('portrait-title').textContent=item.label;byId('art-counter').textContent=(artIndex+1)+' / '+gallery.length+' 張';
 byId('art-view-image').src=item.src;byId('art-view-image').alt=byId('portrait').alt;
 byId('art-view-title').textContent=people[index].name+'・立繪';byId('art-view-label').textContent=item.label;byId('art-view-counter').textContent=(artIndex+1)+' / '+gallery.length;
 renderHeadVariants(item);
 ['art-previous','art-next','art-view-previous','art-view-next'].forEach(id=>byId(id).disabled=gallery.length<2);
}
function switchPortrait(step){artIndex+=step;renderPortrait();}
function closePortrait(){byId('art-modal').hidden=true;if(artReturnFocus)artReturnFocus.focus();}
function renderReading(){
 const person=people[index],reading=byId('reading');reading.replaceChildren();
 byId('tab-intro').setAttribute('aria-selected',String(tab==='intro'));byId('tab-notes').setAttribute('aria-selected',String(tab==='notes'));reading.setAttribute('aria-labelledby',tab==='intro'?'tab-intro':'tab-notes');
 if(tab==='intro'){
  if(person.draftLabel)reading.append(el('span','draft-label',person.draftLabel));
  if(person.facts){const facts=el('div','facts');person.facts.forEach(([label,value])=>{const item=el('div');item.append(el('span','fact-label',label),document.createTextNode(value));facts.append(item);});reading.append(facts);}
  if(person.paragraphs){person.paragraphs.forEach(p=>reading.append(el('p','',p)));if(person.relation)reading.append(el('div','relation',person.relation));}
  else{const box=el('div','pending');box.append(el('h3','','介紹文案待整理'),el('p','','此人物已列入完整收錄名單，將依處理順序整理基本介紹、人物關係與逸聞。'));reading.append(box);}
 }else if(person.notes&&person.notes.length){
  reading.append(el('span','draft-label',person.draftLabel||'逸聞排版示意・內容待確認'));
  person.notes.forEach(([title,body])=>{const section=el('section','anecdote');section.append(el('h3','section-title',title),el('p','',body));reading.append(section);});
 }else{const box=el('div','pending');box.append(el('h3','','人物逸聞待補'),el('p','','此區預留人物往事、習慣與正文之外的補充。內容將依既定設定整理，新增逸聞經確認後收錄。'));reading.append(box);}
 reading.scrollTop=0;
}
function selectPerson(i){
 index=(i+people.length)%people.length;tab='intro';artIndex=0;const p=people[index];byId('entry').hidden=true;byId('art-modal').hidden=true;
 document.querySelectorAll('.person').forEach((b,n)=>b.setAttribute('aria-current',String(n===index)));
 byId('layout').classList.toggle('text-only',!p.image);byId('category').textContent=p.group;byId('character-name').textContent=p.name;byId('character-name').classList.toggle('long',p.name.length>5);byId('identity').textContent=p.identity;
 const gallery=currentGallery();
 const image=byId('portrait');if(gallery.length){renderPortrait();}else{image.removeAttribute('src');image.alt='';byId('art-view-image').removeAttribute('src');renderHeadVariants({});}
 byId('portrait-number').textContent='人物誌 / '+String(index+1).padStart(2,'0');byId('page-number').textContent=String(index+1).padStart(2,'0')+' / '+people.length;byId('footer-title').textContent=p.group+'　・　'+p.name;renderReading();
}
byId('tab-intro').addEventListener('click',()=>{tab='intro';renderReading();});byId('tab-notes').addEventListener('click',()=>{tab='notes';renderReading();});
document.querySelector('.tabs').addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();event.stopPropagation();tab=tab==='intro'?'notes':'intro';renderReading();byId(tab==='intro'?'tab-intro':'tab-notes').focus();}});
byId('previous').addEventListener('click',()=>selectPerson(index-1));byId('next').addEventListener('click',()=>selectPerson(index+1));byId('show-portrait').addEventListener('click',()=>selectPerson(0));byId('show-text').addEventListener('click',()=>selectPerson(9));
byId('show-bonus').addEventListener('click',()=>{selectPerson(0);artIndex=currentGallery().length-1;renderPortrait();});
['art-previous','art-view-previous'].forEach(id=>byId(id).addEventListener('click',()=>switchPortrait(-1)));['art-next','art-view-next'].forEach(id=>byId(id).addEventListener('click',()=>switchPortrait(1)));
byId('art-enlarge').addEventListener('click',()=>{artReturnFocus=document.activeElement;byId('art-modal').hidden=false;byId('art-close').focus();});byId('art-close').addEventListener('click',closePortrait);
byId('art-modal').addEventListener('keydown',event=>{if(event.key==='Tab'){const focusable=[byId('art-close'),byId('art-view-previous'),byId('art-view-next')].filter(b=>!b.disabled);const pos=focusable.indexOf(document.activeElement);if(event.shiftKey&&pos===0){event.preventDefault();focusable.at(-1).focus();}else if(!event.shiftKey&&pos===focusable.length-1){event.preventDefault();focusable[0].focus();}}});
byId('return').addEventListener('click',()=>{byId('entry').hidden=false;byId('reopen').focus();});byId('reopen').addEventListener('click',()=>{byId('entry').hidden=true;document.querySelector('[aria-current=true]').focus();});
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey)return;if(!byId('art-modal').hidden){if(event.key==='Escape'){event.preventDefault();closePortrait();}else if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchPortrait(event.key==='ArrowRight'?1:-1);}return;}if(event.target.closest('.portrait-tools')){if(event.key==='Escape')byId('entry').hidden=false;return;}if(event.key==='Escape'){byId('entry').hidden=!byId('entry').hidden;}else if(byId('entry').hidden&&(event.key==='ArrowLeft'||event.key==='ArrowRight')){event.preventDefault();selectPerson(index+(event.key==='ArrowRight'?1:-1));}});
const holder=byId('canvas-holder'),stage=byId('stage');
function resize(){const full=!!document.fullscreenElement;const scale=full?Math.min(innerWidth/1280,innerHeight/720):Math.min(holder.clientWidth/1280,1);stage.style.setProperty('--scale',scale);if(!full){holder.style.height=(720*scale)+'px';stage.style.left=((holder.clientWidth-1280*scale)/2)+'px';}else stage.style.left='0';}
new ResizeObserver(resize).observe(holder);window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);
byId('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await holder.requestFullscreen();}catch{byId('fullscreen').textContent='請使用瀏覽器全螢幕';}});
selectPerson(0);resize();
</script>
